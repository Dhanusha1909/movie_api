<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie App</title>
    <style>
        .container{
            display: flex;
            flex-direction: column;
            width:300px;
            height:300px;
            border:2px solid rgb(17, 144, 223);
            align-items: center;
            justify-content: center;
        }
        body{
            display:flex;
            height:100vh;
            justify-content: center;
            align-items: center;
             background: linear-gradient(135deg, rgb(3, 3, 41), rgb(5,10,41));
        }
        h2{
            color:white;
        }
        input{
            height:45px;
            border:2px solid rgb(0,255,255);
            border-radius: 10px;
            margin-bottom: 10px;
        }
        button{
            background: transparent;
            height:30px;
            color:white;
            border-radius:10px;
            border:2px solid rgb(0,255,255);
            width:100px;
            cursor: pointer;
        }
        button:hover{
            background: white;
            color:black;
        }
        p{
            color:white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Movie Search</h2>
        <input id="movie" type="text" placeholder="Enter movie name" required>
        <button onclick="getMovie()">Search</button>
        <div class="details">
            <p id="name"></p>
            <p id="rating"></p>
        </div>
    </div>
    <script>
        async function getMovie(){
            const names=document.getElementById("movie").value.trim();
            const name=document.getElementById("name");
            const rate=document.getElementById("rating");
            const res=await fetch(`https://api.tvmaze.com/search/shows?q=${names}`);
            const data=await res.json();
            const movie=data[0].show;
            name.innerText=movie.name;
            rate.innerText=movie.rating.average?"Rating"+movie.rating.average:"No rating available";
        }
    </script>
</body>
</html>
